<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e0c"><title>EROS TRACKING MOBILE — PRUEBA</title><style>
:root{color-scheme:dark;--bg:#080e0c;--panel:#111c18;--line:#284637;--green:#54f59c;--blue:#51b7ff;--text:#e5f5eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Arial;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:510px;margin:auto;padding:22px 17px 40px}.eyebrow{font:700 11px monospace;color:var(--green);letter-spacing:2px}.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:23px}h1{font:800 28px/1.1 system-ui;margin:7px 0 0;letter-spacing:-1px}.chip{border:1px solid var(--green);border-radius:5px;color:var(--green);font:700 11px monospace;padding:7px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}label{display:block;color:#a6c4b2;font:700 11px monospace;letter-spacing:1px;margin:0 0 8px}input{width:100%;padding:14px 13px;background:#050b08;color:var(--text);border:1px solid #3b5a49;border-radius:7px;font-size:16px;outline:none;margin-bottom:17px}input:focus{border-color:var(--green)}input:last-child{margin-bottom:0}.section{color:var(--green);font:700 12px monospace;letter-spacing:1.3px;margin:20px 0 11px}.actions{display:grid;gap:10px}button{cursor:pointer;border:1px solid #3c7b58;border-radius:8px;background:#143522;color:#d8ffe7;font:800 14px system-ui;padding:17px;text-align:left;min-height:55px}button:active{transform:scale(.99)}button.blue{background:#102d44;border-color:#306c9c;color:#c7eaff}button.amber{background:#332817;border-color:#8d6d30;color:#ffe2a0}.output{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;color:#e0f1e5;background:#050b08;border:1px solid #335341;border-radius:8px;padding:15px;min-height:90px}.copy{width:100%;margin-top:12px;text-align:center;background:#2ed47c;color:#05210f;border:0}.hint{color:#9ab2a3;font-size:12px;line-height:1.55;margin:14px 2px}.status{font:700 12px monospace;color:var(--green);min-height:17px;margin-top:8px}small{color:#8fa799}#resultPanel{display:none}#resultPanel.visible{display:block}
</style></head><body><main><div class="header"><div><div class="eyebrow">EROS SYSTEMS / DEMO 01</div><h1>TRACKING<br>MOBILE</h1></div><div class="chip">● TEST</div></div><div class="panel"><label for="order">NÚMERO DE ORDEN</label><input id="order" placeholder="Ej. 1520" inputmode="numeric" autocomplete="off"><label for="product">PRODUCTO / DISEÑO</label><input id="product" placeholder="Ej. DANZIG NEGRO XL"><label for="date">FECHA DEL PEDIDO</label><input id="date" type="date"></div><div class="section">SELECCIONA UNA RESPUESTA</div><div class="actions"><button data-type="production">01 / EN PRODUCCIÓN</button><button data-type="shipped" class="blue">02 / PEDIDO ENVIADO</button><button data-type="tracking" class="amber">03 / TRACKING SIN ACTUALIZAR</button><button data-type="address">04 / CAMBIO DE DIRECCIÓN</button></div><div id="resultPanel" class="panel" style="margin-top:18px"><div class="section" style="margin-top:0">RESPUESTA LISTA</div><div id="output" class="output"></div><button class="copy" id="copy">COPIAR RESPUESTA</button><div class="status" id="status" aria-live="polite"></div></div><p class="hint">VERSIÓN DE PRUEBA · No consulta Big Cartel ni envía mensajes. Copia los datos del pedido desde la app de Big Cartel. Todo funciona en este archivo, sin cuentas ni servidores.</p></main><script>
const $=id=>document.getElementById(id);let current='';$('date').value=new Date().toLocaleDateString('en-CA');
function formatDate(s){if(!s)return 'an unspecified date';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}function elapsed(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return Math.max(0,Math.floor((Date.now()-new Date(y,m-1,d,12).getTime())/86400000));}
function make(type){const n=$('order').value.trim(),p=$('product').value.trim(),date=$('date').value,days=elapsed(date),order=n?` #${n}`:'',dateInfo=date?`Your order was placed on ${formatDate(date)}${days===null?'':` (${days} days ago)`}. `:'';let body='';if(type==='production')body=`Hi! Your order${order}${p?` contains ${p}`:''} is currently in production. Our estimated production time is 5–6 weeks. ${dateInfo}Once production is complete, your order will be shipped, and you'll receive tracking info via email.`;if(type==='shipped')body=`Hi! Your order${order} has been shipped. You should have received your tracking information by email. Please allow 7–10 days for tracking updates to appear.`;if(type==='tracking')body=`Hi! Your order${order} has already been shipped. Tracking updates can take 7–10 days to appear. You can check the shipment here:\n\nCorreos de México: https://www.correosdemexico.gob.mx/SSLServicios/SeguimientoEnvio/Seguimiento.aspx\nUSPS: https://tools.usps.com/go/TrackConfirmAction\n\nThank you for your patience.`;if(type==='address')body=`Hi, okay, I've just made the address change. Once your order has been shipped, you will receive tracking info via email.`;current=body.replace(/ +/g,' ').trim()+'\n\n–Eros';$('output').textContent=current;$('resultPanel').classList.add('visible');$('status').textContent='';$('resultPanel').scrollIntoView({behavior:'smooth',block:'nearest'});}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>make(b.dataset.type)));
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current);$('status').textContent='✓ RESPUESTA COPIADA';}catch(e){const ta=document.createElement('textarea');ta.value=current;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();$('status').textContent=ok?'✓ RESPUESTA COPIADA':'Mantén presionado el texto para copiarlo.';}});
</script></body></html>
